[project]
name = "pixel-patrol-tomato-harvest-helper"
version = "0.1.0"
description = "Minimal extension example for PixelPatrol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pixel_patrol_base>=0.1.0",
    "numpy",
    "pillow",
]

[project.urls]
Homepage = "https://pixelpatrol.app/"
Repository = "https://github.com/ida-mdc/pixel-patrol-example-extension"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_patrol_tomato_harvest_helper"]

[project.entry-points."pixel_patrol.loader_plugins"]
my_extension_loaders = "pixel_patrol_tomato_harvest_helper.plugin_registry:register_loader_plugins"

[project.entry-points."pixel_patrol.processor_plugins"]
my_extension_processors = "pixel_patrol_tomato_harvest_helper.plugin_registry:register_processor_plugins"

[project.entry-points."pixel_patrol.viewer_extensions"]
my_extension_viewer = "pixel_patrol_tomato_harvest_helper.plugin_registry:get_viewer_extension_dir"